<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Administração</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .login-container {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 5%;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e1eb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .campo input:focus {
            outline: none;
            border-color: #0875c9;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0875c9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:disabled {
            opacity: 0.7;
        }

        .mensagem {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0875c9;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header class="cabecalho">

    <div class="logo">
        <span>SGE</span>
        <strong>Informática Prática</strong>
    </div>

    <button class="menu-btn" onclick="abrirMenu()">☰</button>

    <nav id="menu">
        <a href="../index.html">Início</a>
        <a href="../pages/cursos.html">Cursos</a>
        <a href="../pages/conteudos.html">Conteúdos</a>
        <a href="../pages/tutoriais.html">Tutoriais</a>
        <a href="../pages/materiais.html">Materiais</a>
        <a href="../pages/comunidade.html">Comunidade</a>
        <a href="../pages/sobre.html">Sobre</a>
        <a href="../pages/contactos.html">Contactos</a>
    </nav>

</header>


<main>

    <section class="login-container">

        <div class="login-box">

            <h1>🔐 Administração</h1>

            <p class="login-subtitulo">
                Acesso reservado à administração
            </p>


            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite o seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite a sua palavra-passe"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnLogin"
                >
                    🔑 Entrar
                </button>

            </form>


            <div
                id="mensagem"
                class="mensagem"
            ></div>


            <a
                href="../index.html"
                class="voltar"
            >
                ← Voltar ao site
            </a>

        </div>

    </section>

</main>


<footer class="rodape">

    <p>
        © 2026 SGE Informática Prática.
        Todos os direitos reservados.
    </p>

</footer>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../js/admin-login.js"></script>

<script src="../js/script.js"></script>

</body>
  </html>
