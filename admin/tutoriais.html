<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tutoriais | Administração - SGE Informática Prática</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .admin-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .admin-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .admin-topo h1 {
            color: #063b73;
        }

        .btn {
            display: inline-block;
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-principal {
            background: #0875c9;
            color: white;
        }

        .btn-secundario {
            background: #e8eef5;
            color: #063b73;
        }

        .btn-perigo {
            background: #dc3545;
            color: white;
        }

        .btn-editar {
            background: #ffc107;
            color: #222;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: none;
        }

        .formulario h2 {
            color: #063b73;
            margin-top: 0;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .campo textarea {
            min-height: 120px;
            resize: vertical;
        }

        .acoes-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tabela-container {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #063b73;
            color: white;
        }

        .estado-ativo {
            color: green;
            font-weight: bold;
        }

        .estado-inativo {
            color: #dc3545;
            font-weight: bold;
        }

        .acoes {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .acoes button {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-ativar {
            background: #198754;
            color: white;
        }

    </style>

</head>


<body>


<div class="admin-container">


    <div class="admin-topo">

        <h1>
            🎬 Gestão de Tutoriais
        </h1>


        <div>

            <button
                class="btn btn-principal"
                onclick="novoTutorial()"
            >
                ➕ Novo tutorial
            </button>


            <a
                href="painel.html"
                class="btn btn-secundario"
            >
                ← Painel
            </a>

        </div>

    </div>


    <!-- FORMULÁRIO -->

    <section
        id="formTutorial"
        class="formulario"
    >

        <h2 id="tituloFormulario">
            Novo tutorial
        </h2>


        <form id="tutorialForm">


            <div class="campo">

                <label for="tituloTutorial">
                    Título
                </label>

                <input
                    type="text"
                    id="tituloTutorial"
                    required
                    placeholder="Ex.: Como criar uma pasta no Windows"
                >

            </div>


            <div class="campo">

                <label for="categoriaTutorial">
                    Categoria
                </label>

                <select
                    id="categoriaTutorial"
                    required
                >

                    <option value="">
                        Selecionar categoria
                    </option>

                    <option value="Informática Básica">
                        Informática Básica
                    </option>

                    <option value="Word">
                        Word
                    </option>

                    <option value="Excel">
                        Excel
                    </option>

                    <option value="PowerPoint">
                        PowerPoint
                    </option>

                    <option value="Windows">
                        Windows
                    </option>

                    <option value="Android">
                        Android
                    </option>

                    <option value="Internet">
                        Internet
                    </option>

                    <option value="Segurança">
                        Segurança Digital
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="resumoTutorial">
                    Resumo
                </label>

                <textarea
                    id="resumoTutorial"
                    required
                    placeholder="Explique brevemente o que o aluno aprenderá..."
                ></textarea>

            </div>


            <div class="campo">

                <label for="linkTutorial">
                    Link do tutorial
                </label>

                <input
                    type="url"
                    id="linkTutorial"
                    required
                    placeholder="https://www.youtube.com/..."
                >

            </div>


            <div class="acoes-form">

                <button
                    type="submit"
                    class="btn btn-principal"
                >
                    💾 Guardar tutorial
                </button>


                <button
                    type="button"
                    class="btn btn-secundario"
                    onclick="cancelarTutorial()"
                >
                    Cancelar
                </button>

            </div>


        </form>

    </section>


    <!-- LISTA -->

    <section>

        <h2>
            Tutoriais cadastrados
        </h2>


        <div class="tabela-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Título
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Resumo
                        </th>

                        <th>
                            Estado
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="listaTutoriais">

                    <tr>

                        <td colspan="5">
                            ⏳ A carregar tutoriais...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script src="../js/admin-tutoriais.js"></script>


</body>

  </html>
