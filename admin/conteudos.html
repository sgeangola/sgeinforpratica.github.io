<!DOCTYPE html><html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conteúdos | Administração</title>

<link rel="stylesheet" href="../css/style.css">

<style>
    .admin-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 5%;
    }

    .admin-topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    .admin-topo h1 {
        margin: 0;
    }

    .acoes-topo {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .form-conteudo {
        display: none;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .form-conteudo.ativo {
        display: block;
    }

    .campo {
        margin-bottom: 18px;
    }

    .campo label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .campo input,
    .campo select,
    .campo textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d8e1eb;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .campo textarea {
        min-height: 150px;
        resize: vertical;
    }

    .botoes-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .tabela-container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
    }

    th,
    td {
        padding: 14px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
    }

    th {
        background: #063b73;
        color: white;
    }

    .estado {
        font-weight: bold;
    }

    .ativo {
        color: green;
    }

    .inativo {
        color: #d62828;
    }

    .btn-pequeno {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin: 2px;
    }

    .btn-editar {
        background: #0875c9;
        color: white;
    }

    .btn-estado {
        background: #f0ad4e;
        color: white;
    }

    .btn-eliminar {
        background: #d62828;
        color: white;
    }

    .btn-novo {
        background: #0875c9;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-voltar {
        background: #063b73;
        color: white;
        padding: 12px 18px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
    }
</style>

</head><body><header class="cabecalho"><div class="logo">
    <span>SGE</span>
    <strong>Informática Prática</strong>
</div>

<a href="painel.html" class="btn-voltar">
    ← Painel
</a>

</header><main><section class="admin-container">

    <div class="admin-topo">

        <div>
            <h1>📚 Conteúdos</h1>
            <p>Publique dicas, aulas e conhecimentos de informática.</p>
        </div>

        <div class="acoes-topo">

            <button
                class="btn-novo"
                onclick="novoConteudo()">
                ➕ Novo conteúdo
            </button>

        </div>

    </div>


    <!-- FORMULÁRIO -->

    <div id="formConteudo" class="form-conteudo">

        <h2 id="tituloFormulario">
            Novo conteúdo
        </h2>

        <form id="formConteudoPublicacao">

            <div class="campo">

                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    required
                    placeholder="Ex.: Como criar uma pasta no Windows"
                >

            </div>


            <div class="campo">

                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria" required>

                    <option value="">
                        Selecione uma categoria
                    </option>

                    <option value="Informática Básica">
                        Informática Básica
                    </option>

                    <option value="Word">
                        Word
                    </option>

                    <option value="Excel">
                        Excel
                    </option>

                    <option value="PowerPoint">
                        PowerPoint
                    </option>

                    <option value="Windows">
                        Windows
                    </option>

                    <option value="Android">
                        Android
                    </option>

                    <option value="Internet">
                        Internet
                    </option>

                    <option value="Segurança">
                        Segurança
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="resumo">
                    Resumo
                </label>

                <textarea
                    id="resumo"
                    placeholder="Pequena descrição do conteúdo..."
                    required
                ></textarea>

            </div>


            <div class="campo">

                <label for="conteudo">
                    Conteúdo completo
                </label>

                <textarea
                    id="conteudo"
                    placeholder="Escreva aqui a aula ou dica completa..."
                    required
                ></textarea>

            </div>


            <div class="botoes-form">

                <button
                    type="submit"
                    class="btn-novo">
                    💾 Guardar conteúdo
                </button>

                <button
                    type="button"
                    class="btn-voltar"
                    onclick="cancelarConteudo()">
                    Cancelar
                </button>

            </div>

        </form>

    </div>


    <!-- LISTA -->

    <div class="tabela-container">

        <table>

            <thead>

                <tr>
                    <th>Título</th>
                    <th>Categoria</th>
                    <th>Resumo</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaConteudos">

                <tr>
                    <td colspan="5">
                        ⏳ A carregar conteúdos...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</section>

</main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../js/admin-conteudos.js"></script></body>
                 </html>
